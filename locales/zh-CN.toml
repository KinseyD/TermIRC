# termirc 简体中文翻译（zh-CN）
#
# 维护规则：
# - 本文件中的键必须与 src/i18n.rs 内嵌注册表（REGISTRY）的键一一对应；
#   缺少或多出的键都会在启动时记录一条警告并回退到内置英文。
# - 花括号参数（如 {server}、{channel}）必须与英文原文完全一致：不能
#   删除、改名或新增，否则该条目会被拒绝并回退到英文。
# - 保持原样的内容：数字与单位（512、400）、IRC 协议记号（JOIN、PART、
#   CTCP ACTION、NUL/CR/LF）、键名（Esc、Enter、PgUp/PgDn、socks5、
#   sasl_username 等），以及以机器可读前缀开头的错误（如
#   unsupported_proxy_type:）——前缀冒号之前的部分不翻译。
# - 下列键实际不会以中文呈现（触发时语言无从得知，永远使用内置英文），
#   仅为保持键集完整而保留：err.cfg_read、err.startup_home、
#   err.startup_config_load。


[servers.example]
username = "YourName"
nickname = "YourName"
# SASL PLAIN authentication (optional): set both keys together or neither.
# On failure the server connection stops permanently instead of retrying.
# sasl_username = "YourAccount"
# sasl_password = "YourSaslPassword"
server = "irc.example.org"
use_tls = true
port = 6697
# Startup join intent: individual # or & names, without keys or multiple targets.
# Runtime /join and /part changes are kept in memory, not written to this file.
channels = ["#example"]
queries = ["alice", "bob"]

# Persistent chat history (optional). Off by default; when enabled, chat and
# action lines for channels and queries are stored in a local SQLite file at
# ~/.local/share/termirc/history.sqlite and replayed when a buffer is opened.
[history]
persist = false
# Days to keep archived messages (applied at startup).
retention_days = 7
# Buffers never written to or restored from the archive: a bare name applies
# to every server, "server/name" to one server.
exclude = ["#overflow", "libera/#huge"]

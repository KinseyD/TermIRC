# termirc configuration. Copy this file to ~/.config/termirc/config.toml.
# Running with no config file at all opens the in-TUI setup wizard
# instead; `/config` reopens it later to edit the first server entry.

[servers.example]
username = "YourName"
nickname = "YourName"
# SASL PLAIN authentication (optional): set both keys together or neither.
# On failure the server connection stops permanently instead of retrying.
# sasl_username = "YourAccount"
# sasl_password = "YourSaslPassword"
server = "irc.example.org"
use_tls = true
port = 6697
# Startup join intent: individual # or & names, without keys or multiple targets.
# Runtime /join and /part changes are kept in memory, not written to this file.
channels = ["#example"]
queries = ["alice", "bob"]

# SOCKS5 proxy for this server (optional). Only "socks5" is supported; DNS
# resolves through the proxy too. For Tor, run a local node and use:
#   type = "socks5", host = "127.0.0.1", port = 9050
# username/password are optional proxy credentials.
# [servers.example.proxy]
# type = "socks5"
# host = "127.0.0.1"
# port = 9050
# # username = "proxyuser"
# # password = "proxypass"

# Persistent chat history (optional). Off by default; when enabled, chat and
# action lines for channels and queries are stored in a local SQLite file at
# ~/.local/share/termirc/history.sqlite and replayed when a buffer is opened.
[history]
persist = false
# Days to keep archived messages (applied at startup).
retention_days = 7
# Buffers never written to or restored from the archive: a bare name applies
# to every server, "server/name" to one server.
exclude = ["#overflow", "libera/#huge"]

# Interface language (optional). "en" uses the built-in English strings.
# Shipped translations (currently zh-CN) are built into the binary and need
# no files. An optional locales/<language>.toml file (searched beside the
# binary, in the working directory, and in ~/.config/termirc/locales/)
# overrides the built-in copy for that language. Missing entries fall back
# to the built-in English text, so an incomplete translation is safe.
[ui]
language = "en"

# Color theme (optional). Each key below is one of the renderer's color roles;
# values are named ANSI-16 colors ("black", "red", ..., "white",
# "bright-black", ..., "bright-white"), 256-color indices (0-255), or
# "#rrggbb" hex strings. Roles not listed keep the built-in dark theme, so an
# absent [theme] table changes nothing. Unknown roles or malformed colors are
# rejected when the config is loaded.
#
# A light-theme example:
# [theme]
# global_bg = "#f5f5f0"        # screen background
# input_bg = "#e8e8e2"         # composer panel background
# separator = "#aaaaaa"        # sidebar/main divider
# accent = "#2f7d4f"           # composer/selection accent
# accent_dim = "#9dbfa9"       # accent while unfocused
# nick = "blue"                # message author prefix
# dim = "#666666"              # channel names, hint descriptions
# sidebar_active_bg = "#d8d8d0"
# sidebar_cursor_bg = "#c8c8c0"
# message_select_bg = "#d0d0c8"
# hover_bg = "#e0e0da"
# input_cursor_fg / input_cursor_bg are deprecated and ignored: the composer
# cursor is the terminal's own cursor and no longer has theme colors.
# status_ok = "green"
# status_err = "red"
# status_pending = "bright-black"
# status_bar_highlight = "#2f7d4f" # focused status-bar segment background

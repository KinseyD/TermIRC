[package]
name = "termirc"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
dirs = "6.0"
futures-util = "0.3"
indexmap = { version = "2", features = ["serde"] }
irc = { version = "1.1", default-features = false, features = ["ctcp", "tls-native", "channel-lists"] }
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "net", "time"] }
toml = { version = "1.1", features = ["preserve_order"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
unicode-width = "0.2"
